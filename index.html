<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ludo Kingdom Pro — Royal Ludo</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/platform-ui.css" />
  <script src="js/three.min.js"></script>
  <script>
    if (typeof THREE === "undefined") {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>
  <style>
    :root {
      --navy-deep: #070b19;
      --gold-primary: #facc15;
      --gold-rich: #d4af37;
      --gold-border: rgba(250, 204, 21, 0.42);
      --text-clean: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      background: var(--navy-deep);
      color: var(--text-clean);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    .auth-gate-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: radial-gradient(circle at top, rgba(20, 32, 66, 0.96), rgba(5, 8, 20, 0.99));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      pointer-events: auto;
    }
    .auth-gate-overlay.hidden { display: none !important; }
    .auth-card {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(165deg, #111d3e 0%, #080d20 100%);
      border: 1.5px solid var(--gold-rich);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.85);
      pointer-events: auto;
    }
    .auth-crown { font-size: 2.6rem; margin-bottom: 6px; }
    .auth-title { font-size: 1.45rem; font-weight: 900; color: var(--gold-primary); margin: 0 0 4px; }
    .auth-sub { font-size: 0.82rem; color: var(--text-muted); margin: 0 0 18px; }
    .auth-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.92rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .btn-google { background: #ffffff; color: #0f172a; }
    .btn-facebook { background: #1877f2; color: #ffffff; }
    .btn-guest { background: linear-gradient(135deg, #facc15, #d97706); color: #070b19; border: 1px solid #fef08a; }
    .auth-skip-btn {
      margin-top: 8px;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .auth-status-msg { margin-top: 10px; font-size: 0.78rem; color: #facc15; min-height: 20px; }
    .avatar-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .modal-overlay { background: rgba(4, 7, 18, 0.84); backdrop-filter: blur(10px); padding: 12px; z-index: 9000; }
    .modal-card {
      background: linear-gradient(165deg, #101b39 0%, #090f24 100%) !important;
      border: 1.5px solid var(--gold-rich) !important;
      border-radius: 20px !important;
      max-width: 420px;
      width: 100%;
      padding: 16px !important;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-header { border-bottom: 1px solid rgba(250, 204, 21, 0.25); padding-bottom: 10px; margin-bottom: 12px; }
    .modal-header h2 { color: var(--gold-primary) !important; font-size: 1.05rem; font-weight: 800; }
    .modal-close {
      background: rgba(250, 204, 21, 0.14) !important;
      border: 1px solid var(--gold-border) !important;
      color: var(--gold-primary) !important;
      border-radius: 10px;
      width: 32px;
      height: 32px;
    }
    .royal-section-title { font-size: 0.74rem; font-weight: 800; text-transform: uppercase; color: var(--gold-primary); margin-bottom: 8px; }
    .quick-modes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .quick-mode-card {
      background: linear-gradient(145deg, #132044, #0c142c);
      border: 1px solid rgba(250, 204, 21, 0.35);
      border-radius: 14px;
      padding: 11px 8px;
      color: #f8fafc;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .slot-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .slot-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 18, 38, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 13px;
      padding: 8px 11px;
    }
    .slot-color-info { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem; }
    .golden-start-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 15px;
      border: 1.5px solid #fef08a;
      background: linear-gradient(135deg, #fde047 0%, #f59e0b 55%, #d97706 100%);
      color: #070b19;
      font-weight: 900;
      font-size: 0.94rem;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .royal-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
      background: #070c1c;
      color: #facc15;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .room-code-banner { background: rgba(250, 204, 21, 0.12); border: 1.5px dashed #facc15; border-radius: 14px; padding: 12px; text-align: center; margin-bottom: 12px; }
    .toggle-pill-btn { padding: 5px 14px; border-radius: 999px; font-weight: 800; font-size: 0.76rem; border: 1px solid var(--gold-rich); background: linear-gradient(135deg, #facc15, #d97706); color: #070b19; cursor: pointer; }
    #game-hud { pointer-events: none; justify-content: space-between; }
    .hud-top { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; z-index: 20; }
    .corner-pods-layer { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
    .corner-pod {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 14px;
      background: rgba(11, 16, 33, 0.9);
      border: 1.5px solid rgba(212, 175, 55, 0.35);
      pointer-events: auto;
      cursor: pointer;
    }
    .corner-pod.inactive-slot { opacity: 0.25; pointer-events: none; }
    .corner-pod.active-turn { border-color: #facc15; box-shadow: 0 0 18px rgba(250, 204, 21, 0.7); }
    .pod-label { font-weight: 800; font-size: 0.84rem; }
    .pod-sub { font-size: 0.68rem; font-weight: 700; color: #cbd5e1; display: block; }
    .pod-dice-box { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.15); }
    .pod-red { color: #ff5a5f; }
    .pod-green { color: #4ade80; }
    .pod-yellow { color: #facc15; }
    .pod-blue { color: #38bdf8; }
    .legacy-hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="auth-gate-overlay" class="auth-gate-overlay">
    <div class="auth-card">
      <div class="auth-crown">👑</div>
      <h2 class="auth-title">LUDO KINGDOM PRO</h2>
      <p class="auth-sub">Sign in to save coins, rank & play online</p>
      <button type="button" class="auth-btn btn-google" id="btn-login-google"><span>🔴</span> Continue with Google</button>

  <canvas id="game-canvas"></canvas>

  <div id="home-screen" class="screen active">
    <header class="top-bar">
      <div class="profile-pill" id="btn-profile">
        <div class="avatar-ring" id="player-avatar-box">👑</div>

        <button class="icon-btn" id="btn-settings" aria-label="Settings">⚙️</button>

    <aside class="side-dock">
      <button class="dock-item" id="btn-daily"><span class="dock-badge"></span><span class="dock-icon">🎁</span><span class="dock-label">Daily</span></button>
      <button class="dock-item" id="btn-quests"><span class="dock-icon">⚔️</span><span class="dock-label">Quests</span></button>
      <button class="dock-item" id="btn-friends"><span class="dock-icon">👥</span><span class="dock-label">Friends</span></button>

  <script src="js/sound-fx.js"></script>

  <script>
    (function () {
      const overlay = document.getElementById("auth-gate-overlay");
      const statusEl = document.getElementById("auth-status-msg");
      const skipBtn = document.getElementById("btn-skip-login");
      const googleBtn = document.getElementById("btn-login-google");
      const fbBtn = document.getElementById("btn-login-facebook");
      const guestBtn = document.getElementById("btn-login-guest");

      if (overlay) {
        overlay.style.pointerEvents = "auto";
        overlay.style.zIndex = "2147483647";
      }

      if (skipBtn) {
        ["click", "touchend"].forEach((ev) => {
          skipBtn.addEventListener(ev, function (e) {
            e.preventDefault();
            e.stopPropagation();
            if (overlay) {
              overlay.classList.add("hidden");
              overlay.style.display = "none";
            }
          }, { passive: false });
        });
      }

      function showAuthNote(msg) {
        if (statusEl) statusEl.textContent = msg;
      }

      if (googleBtn) {
        googleBtn.addEventListener("click", function () {
          if (typeof window.__royalLoginGoogle === "function") {
            window.__royalLoginGoogle();
          } else {
            showAuthNote("Loading Google sign-in...");
          }
        });
      }

      if (fbBtn) {
        fbBtn.addEventListener("click", function () {
          if (typeof window.__royalLoginFacebook === "function") {
            window.__royalLoginFacebook();
          } else {
            showAuthNote("Loading Facebook sign-in...");
          }
        });
      }

      if (guestBtn) {
        guestBtn.addEventListener("click", function () {
          if (typeof window.__royalLoginGuest === "function") {
            window.__royalLoginGuest();
          } else {
            showAuthNote("Loading Guest login...");
          }
        });
      }
    })();
  </script>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import {
      loginWithGoogle,
      loginWithFacebook,
      loginAsGuest,
      logoutPlayer,
      watchAuthState
    } from "./js/auth-profile.js";
    import {
      createPrivateRoom,
      joinPrivateRoom,
      findOnlineMatch,
      subscribeToRoom,
      startOnlineRoomMatch,
      leaveOnlineRoom
    } from "./js/online-room.js";

    const authOverlay = document.getElementById("auth-gate-overlay");
    const statusMsg = document.getElementById("auth-status-msg");
    const modalOverlay = document.getElementById("modal-overlay");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");

    function hideAuthOverlay() {
      if (authOverlay) {
        authOverlay.classList.add("hidden");
        authOverlay.style.display = "none";
      }
    }

    async function runAuth(fn, label) {
      if (statusMsg) statusMsg.textContent = `Signing in with ${label}...`;
      try {
        await fn();
        if (statusMsg) statusMsg.textContent = "";
      } catch (err) {
        if (statusMsg) statusMsg.textContent = err?.message || `${label} sign-in failed.`;
      }
    }

    window.__royalLoginGoogle = () => runAuth(loginWithGoogle, "Google");
    window.__royalLoginFacebook = () => runAuth(loginWithFacebook, "Facebook");
    window.__royalLoginGuest = () => runAuth(loginAsGuest, "Guest");

    watchAuthState((user, profile) => {
      window.currentRoyalUser = user;
      window.currentRoyalProfile = profile;
      if (user && profile) {
        const nameEl = document.getElementById("display-name");
        const lvlEl = document.getElementById("player-level-badge");
        const coinEl = document.getElementById("coin-balance");
        const box = document.getElementById("player-avatar-box");

        if (nameEl) nameEl.textContent = profile.name || "Royal Player";
        if (lvlEl) lvlEl.textContent = `Lvl ${profile.level || 1} • ${profile.isGuest ? "Guest" : "Verified"}`;
        if (coinEl) coinEl.textContent = Number(profile.coins || 1000).toLocaleString();
        if (box) box.innerHTML = profile.avatar ? `<img src="${profile.avatar}" alt="Avatar" />` : "👑";
        hideAuthOverlay();
      }
    });

    function renderWaitingRoom(roomData) {
      window.activeOnlineRoom = roomData;
      const players = Object.values(roomData.players || {});
      const isHost = auth.currentUser && roomData.hostUid === auth.currentUser.uid;
      const badge = { red: "🔴", green: "🟢", yellow: "🟡", blue: "🔵" };

      modalTitle.textContent = roomData.isPrivate ? "🏰 PRIVATE ROYAL ROOM" : "🌐 RANDOM ONLINE MATCH";
      modalBody.innerHTML = `
        <div class="room-code-banner">
          <div style="font-size:0.72rem;color:#cbd5e1;font-weight:700;">ROOM CODE</div>
          <div style="font-size:1.55rem;font-weight:900;color:#facc15;letter-spacing:4px;margin:4px 0;">${roomData.roomId}</div>
          <button type="button" id="btn-copy-code" class="toggle-pill-btn on">📋 Copy Code</button>
        </div>
        <div class="royal-section-title">Players (${players.length}/${roomData.maxPlayers})</div>
        <div class="slot-list">
          ${players.map((p) => `<div class="slot-row"><div class="slot-color-info"><span>${badge[p.color] || "🎲"}</span><span>${p.name}${p.isHost ? " 👑" : ""}</span></div><span style="font-size:0.74rem;color:#4ade80;font-weight:800;">READY</span></div>`).join("")}
        </div>
        ${isHost ? `<button type="button" id="btn-start-room" class="golden-start-btn" style="margin-bottom:8px;">🚀 Start Match (${players.length}P)</button>` : ""}
        <button type="button" id="btn-leave-room" class="golden-start-btn" style="background:#1e293b;border-color:#64748b;color:#fff;">← Leave Room</button>
      `;
      modalOverlay.classList.remove("hidden");

      document.getElementById("btn-copy-code").onclick = function () {
        navigator.clipboard?.writeText(roomData.roomId);
        this.textContent = "✅ Copied!";
      };
      if (isHost) {
        document.getElementById("btn-start-room").onclick = () => startOnlineRoomMatch(roomData.roomId);
      }
      document.getElementById("btn-leave-room").onclick = async () => {
        await leaveOnlineRoom();
        window.activeOnlineRoom = null;
        modalOverlay.classList.add("hidden");
