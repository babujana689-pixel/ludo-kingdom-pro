<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LUDO ADDA — Social Gaming & Royal Ludo</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/platform-ui.css" />
  <script src="js/three.min.js"></script>
  <script>
    if (typeof THREE === "undefined") {
      document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
    }
  </script>
  <style>
    :root {
      --navy-deep: #070b19;
      --gold-primary: #facc15;
      --gold-rich: #d4af37;
      --gold-border: rgba(250, 204, 21, 0.42);
      --text-clean: #f8fafc;
      --text-muted: #94a3b8;
    }
    body {
      background: var(--navy-deep);
      color: var(--text-clean);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    }
    .auth-gate-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: radial-gradient(circle at top, rgba(20, 32, 66, 0.96), rgba(5, 8, 20, 0.99));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      pointer-events: auto;
    }
    .auth-gate-overlay.hidden { display: none !important; }
    .auth-card {
      width: 100%;
      max-width: 390px;
      background: linear-gradient(165deg, #111d3e 0%, #080d20 100%);
      border: 1.5px solid var(--gold-rich);
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.85);
      pointer-events: auto;
      touch-action: manipulation;
    }
    .auth-crown { font-size: 2.6rem; margin-bottom: 6px; }
    .auth-title { font-size: 1.45rem; font-weight: 900; color: var(--gold-primary); margin: 0 0 4px; }
    .auth-sub { font-size: 0.82rem; color: var(--text-muted); margin: 0 0 18px; }
    .auth-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.92rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .btn-google { background: #ffffff; color: #0f172a; }
    .btn-facebook { background: #1877f2; color: #ffffff; }
    .btn-guest { background: linear-gradient(135deg, #facc15, #d97706); color: #070b19; border: 1px solid #fef08a; }
    .auth-skip-btn {
      margin-top: 8px;
      padding: 8px 12px;
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
    }
    .auth-status-msg { margin-top: 10px; font-size: 0.78rem; color: #facc15; min-height: 20px; }
    .avatar-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .profile-pill.static-card { cursor: default; pointer-events: none; }
    .modal-overlay { background: rgba(4, 7, 18, 0.84); backdrop-filter: blur(10px); padding: 12px; z-index: 9000; }
    .modal-card {
      background: linear-gradient(165deg, #101b39 0%, #090f24 100%) !important;
      border: 1.5px solid var(--gold-rich) !important;
      border-radius: 20px !important;
      max-width: 420px;
      width: 100%;
      padding: 16px !important;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-header { border-bottom: 1px solid rgba(250, 204, 21, 0.25); padding-bottom: 10px; margin-bottom: 12px; }
    .modal-header h2 { color: var(--gold-primary) !important; font-size: 1.05rem; font-weight: 800; }
    .modal-close {
      background: rgba(250, 204, 21, 0.14) !important;
      border: 1px solid var(--gold-border) !important;
      color: var(--gold-primary) !important;
      border-radius: 10px;
      width: 32px;
      height: 32px;
    }
    .royal-section-title { font-size: 0.74rem; font-weight: 800; text-transform: uppercase; color: var(--gold-primary); margin-bottom: 8px; }
    .quick-modes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .quick-mode-card {
      background: linear-gradient(145deg, #132044, #0c142c);
      border: 1px solid rgba(250, 204, 21, 0.35);
      border-radius: 14px;
      padding: 11px 8px;
      color: #f8fafc;
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .slot-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .slot-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(11, 18, 38, 0.9);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 13px;
      padding: 8px 11px;
    }
    .slot-color-info { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem; }
    .golden-start-btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 15px;
      border: 1.5px solid #fef08a;
      background: linear-gradient(135deg, #fde047 0%, #f59e0b 55%, #d97706 100%);
      color: #070b19;
      font-weight: 900;
      font-size: 0.94rem;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .royal-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid rgba(250, 204, 21, 0.45);
      background: #070c1c;
      color: #facc15;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 3px;
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .room-code-banner { background: rgba(250, 204, 21, 0.12); border: 1.5px dashed #facc15; border-radius: 14px; padding: 12px; text-align: center; margin-bottom: 12px; }
    .toggle-pill-btn { padding: 5px 14px; border-radius: 999px; font-weight: 800; font-size: 0.76rem; border: 1px solid var(--gold-rich); background: linear-gradient(135deg, #facc15, #d97706); color: #070b19; cursor: pointer; }
    #game-hud { pointer-events: none; justify-content: space-between; }
    .hud-top { pointer-events: auto; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; z-index: 20; }
    .corner-pods-layer { position: fixed; inset: 0; pointer-events: none; z-index: 15; }
    .corner-pod {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 14px;
      background: rgba(11, 16, 33, 0.9);
      border: 1.5px solid rgba(212, 175, 55, 0.35);
      pointer-events: auto;
      cursor: pointer;
    }
    .corner-pod.inactive-slot { opacity: 0.25; pointer-events: none; }
    .corner-pod.active-turn { border-color: #facc15; box-shadow: 0 0 18px rgba(250, 204, 21, 0.7); }
    .pod-label { font-weight: 800; font-size: 0.84rem; }
    .pod-sub { font-size: 0.68rem; font-weight: 700; color: #cbd5e1; display: block; }
    .pod-dice-box { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.15); }
    .pod-red { color: #ff5a5f; }
    .pod-green { color: #4ade80; }
    .pod-yellow { color: #facc15; }
    .pod-blue { color: #38bdf8; }
    .legacy-hidden { display: none !important; }
    .bottom-nav { grid-template-columns: repeat(5, 1fr) !important; gap: 4px !important; }
  </style>
</head>
<body>
  <div id="auth-gate-overlay" class="auth-gate-overlay">
    <div class="auth-card">
      <div class="auth-crown">👑</div>
      <h2 class="auth-title">LUDO ADDA</h2>
      <p class="auth-sub">Sign in to save coins, friends & game rooms</p>
      <button type="button" class="auth-btn btn-google" id="btn-login-google"><span>🔴</span> Continue with Google</button>
      <button type="button" class="auth-btn btn-facebook" id="btn-login-facebook"><span>🔵</span> Continue with Facebook</button>
      <button type="button" class="auth-btn btn-guest" id="btn-login-guest"><span>🎲</span> Play as Guest (Instant)</button>
      <button type="button" class="auth-skip-btn" id="btn-skip-login">Play Offline Without Account</button>
      <div class="auth-status-msg" id="auth-status-msg"></div>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="home-screen" class="screen active">
    <header class="top-bar">
      <div class="profile-pill static-card" id="top-profile-card" aria-label="Player Profile Info">
        <div class="avatar-ring" id="player-avatar-box">👑</div>
        <div class="profile-info">
          <span class="player-name" id="display-name">Royal Guest</span>
          <span class="player-level" id="player-level-badge">Lvl 1 • Novice</span>
        </div>
      </div>
      <div class="currency-group" aria-label="Balances and Settings">
        <div class="currency-pill"><span class="coin-icon">🟡</span><span id="coin-balance">1,000</span></div>
        <div class="currency-pill"><span class="gem-icon">💎</span><span id="gem-balance">25</span></div>
        <button type="button" class="icon-btn" id="btn-settings" aria-label="Settings">⚙️</button>
      </div>
    </header>

    <aside class="side-dock" aria-label="Quick Menu">
      <button type="button" class="dock-item" id="btn-daily"><span class="dock-badge"></span><span class="dock-icon">🎁</span><span class="dock-label">Daily</span></button>
      <button type="button" class="dock-item" id="btn-quests"><span class="dock-icon">⚔️</span><span class="dock-label">Quests</span></button>
      <button type="button" class="dock-item" id="btn-events"><span class="dock-icon">🏆</span><span class="dock-label">Events</span></button>
      <button type="button" class="dock-item" id="btn-alerts"><span class="dock-icon">🔔</span><span class="dock-label">Alerts</span></button>
    </aside>

    <main class="hero-center">
      <div class="royal-badge">★ ROYAL GAMING ADDA ★</div>
      <h1 class="game-title"><span class="title-main">LUDO ADDA</span><span class="title-3d">PRO</span></h1>
      <p class="game-subtitle">Roll the Dice • Play & Chat in Rooms</p>
    </main>

    <section class="bottom-controls">
      <button type="button" class="btn-primary-hero" id="btn-play-offline">
        <span class="btn-hero-icon">🎲</span>
        <div class="btn-hero-text">
          <span class="btn-hero-title">OFFLINE LUDO & AI</span>
          <span class="btn-hero-sub">Pass & Play • Smart AI Bots</span>
        </div>
      </button>

      <div class="mode-grid">
        <button type="button" class="mode-card" id="btn-play-online">
          <span class="mode-icon">🌐</span>
          <span class="mode-title">Online Ludo</span>
          <span class="mode-tag">2P / 4P Live</span>
        </button>
        <button type="button" class="mode-card" id="btn-private-room">
          <span class="mode-icon">🏰</span>
          <span class="mode-title">Private Room</span>
          <span class="mode-tag">Code + Room Mic</span>
        </button>
      </div>

      <button type="button" class="mode-card" id="btn-voice-room" style="width:100%;flex-direction:row;gap:10px;padding:10px 14px;">
        <span class="mode-icon">🎙️</span>
        <span class="mode-title">Public Gaming Voice Room</span>
        <span class="mode-tag">Gaming Adda</span>
      </button>

      <nav class="bottom-nav" aria-label="Bottom Navigation">
        <button type="button" class="nav-btn active" id="nav-home">🏠<span>Home</span></button>
        <button type="button" class="nav-btn" id="nav-friends">👥<span>Friends</span></button>
        <button type="button" class="nav-btn" id="nav-game-rooms">🎮<span>Game Rooms</span></button>
        <button type="button" class="nav-btn" id="nav-chats">💬<span>Chats</span><span class="chat-nav-badge hidden" id="chat-unread-badge">0</span></button>
        <button type="button" class="nav-btn" id="nav-skin-shop">🎨<span>Skin Shop</span></button>
      </nav>
    </section>
  </div>

  <div id="game-hud" class="screen">
    <div class="hud-top">
      <button type="button" class="hud-pill-btn" id="btn-exit-match">← Lobby</button>
      <div class="match-info-badge" id="match-mode-label">LUDO ADDA</div>
      <div style="display:flex;gap:6px;">
        <button type="button" class="hud-pill-btn" id="btn-ingame-audio">🔊</button>
        <button type="button" class="hud-pill-btn" id="btn-reset-cam">🎥</button>
      </div>
    </div>

    <div class="corner-pods-layer" id="corner-pods-layer">
      <div class="corner-pod" id="hud-green" data-dice-color="green">
        <div class="pod-dice-box" id="dice-slot-green"></div>
        <div><span class="pod-label pod-green" id="name-green">🟢 GREEN</span><span class="pod-sub" id="score-green">0/4</span></div>
      </div>
      <div class="corner-pod" id="hud-yellow" data-dice-color="yellow">
        <div style="text-align:right;"><span class="pod-label pod-yellow" id="name-yellow">🟡 YELLOW</span><span class="pod-sub" id="score-yellow">0/4</span></div>
        <div class="pod-dice-box" id="dice-slot-yellow"></div>
      </div>
      <div class="corner-pod" id="hud-red" data-dice-color="red">
        <div class="pod-dice-box" id="dice-slot-red"></div>
        <div><span class="pod-label pod-red" id="name-red">🔴 RED</span><span class="pod-sub" id="score-red">0/4</span></div>
      </div>
      <div class="corner-pod" id="hud-blue" data-dice-color="blue">
        <div style="text-align:right;"><span class="pod-label pod-blue" id="name-blue">🔵 BLUE</span><span class="pod-sub" id="score-blue">0/4</span></div>
        <div class="pod-dice-box" id="dice-slot-blue"></div>
      </div>
    </div>

    <div class="legacy-hidden">
      <div id="turn-status-text"></div>
      <button id="btn-roll-dice"><span id="dice-face-icon"></span><span id="dice-value-label"></span></button>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Modal Title</h2>
        <button type="button" class="modal-close" id="btn-close-modal">✕</button>
      </div>
      <div class="modal-body" id="modal-body">
        <div id="earn-rewards-slot" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/sound-fx.js"></script>
  <script src="js/board3d.js"></script>
  <script src="js/ludo-engine.js"></script>
  <script src="js/main.js"></script>

  <script>
    (function () {
      const overlay = document.getElementById("auth-gate-overlay");
      const statusEl = document.getElementById("auth-status-msg");
      const skipBtn = document.getElementById("btn-skip-login");
      const googleBtn = document.getElementById("btn-login-google");
      const fbBtn = document.getElementById("btn-login-facebook");
      const guestBtn = document.getElementById("btn-login-guest");

      if (overlay) {
        overlay.style.pointerEvents = "auto";
        overlay.style.zIndex = "2147483647";
      }

      if (skipBtn) {
        skipBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          if (overlay) {
            overlay.classList.add("hidden");
            overlay.style.display = "none";
          }
        });
      }

      function showAuthNote(msg) {
        if (statusEl) statusEl.textContent = msg;
      }

      if (googleBtn) {
        googleBtn.addEventListener("click", function () {
          if (typeof window.__royalLoginGoogle === "function") {
            window.__royalLoginGoogle();
          } else {
            showAuthNote("Loading Google sign-in...");
          }
        });
      }

      if (fbBtn) {
        fbBtn.addEventListener("click", function () {
          if (typeof window.__royalLoginFacebook === "function") {
            window.__royalLoginFacebook();
          } else {
            showAuthNote("Loading Facebook sign-in...");
          }
        });
      }

      if (guestBtn) {
        guestBtn.addEventListener("click", function () {
          if (typeof window.__royalLoginGuest === "function") {
            window.__royalLoginGuest();
          } else {
            showAuthNote("Loading Guest login...");
          }
        });
      }
    })();
  </script>

  <script type="module">
    import { auth } from "./js/firebase-config.js";
    import {
      loginWithGoogle,
      loginWithFacebook,
      loginAsGuest,
      logoutPlayer,
      watchAuthState
    } from "./js/auth-profile.js";
    import {
      createPrivateRoom,
      joinPrivateRoom,
      findOnlineMatch,
      subscribeToRoom,
      startOnlineRoomMatch,
      leaveOnlineRoom
    } from "./js/online-room.js";
    import { openSkinShop } from "./js/skin-shop.js";
    import "./js/text-chat.js";

    const authOverlay = document.getElementById("auth-gate-overlay");
    const statusMsg = document.getElementById("auth-status-msg");
    const modalOverlay = document.getElementById("modal-overlay");
    const modalTitle = document.getElementById("modal-title");
    const modalBody = document.getElementById("modal-body");

    if (typeof window.showToast !== "function") {
      window.showToast = (msg) => {
        const t = document.getElementById("toast");
        if (!t) return;
        t.textContent = String(msg ?? "");
        t.classList.remove("hidden");
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.add("hidden"), 2300);
      };
    }

    function escapeHtml(val) {
      return String(val ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function hideAuthOverlay() {
      if (authOverlay) {
        authOverlay.classList.add("hidden");
        authOverlay.style.display = "none";
      }
    }

    async function runAuth(fn, label) {
      if (statusMsg) statusMsg.textContent = `Signing in with ${label}...`;
      try {
        await fn();
        if (statusMsg) statusMsg.textContent = "";
      } catch (err) {
        if (statusMsg) statusMsg.textContent = err?.message || `${label} sign-in failed.`;
      }
    }

    window.__royalLoginGoogle = () => runAuth(loginWithGoogle, "Google");
    window.__royalLoginFacebook = () => runAuth(loginWithFacebook, "Facebook");
    window.__royalLoginGuest = () => runAuth(loginAsGuest, "Guest");
    window.__royalLogout = () => logoutPlayer();
    window.__royalOpenSkinShop = openSkinShop;
    window.__royalRoomApi = {
      auth,
      createPrivateRoom,
      joinPrivateRoom,
      findOnlineMatch,
      subscribeToRoom,
      startOnlineRoomMatch,
      leaveOnlineRoom
    };

    document.getElementById("nav-skin-shop")?.addEventListener("click", () => {
      if (typeof window.__royalOpenSkinShop === "function") {
        window.__royalOpenSkinShop();
      } else {
        window.showToast("Skin Shop module not loaded yet.");
      }
    });

    document.getElementById("nav-game-rooms")?.addEventListener("click", () => {
      if (modalTitle) modalTitle.textContent = "Game Rooms & Earn Rewards";
      if (modalBody) {
        modalBody.innerHTML = `
          <div class="royal-section-title">Game Rooms</div>
          <p style="font-size:0.82rem;color:#cbd5e1;margin:0 0 12px;">Online Ludo, Private Room অথবা নিচের Earn Rewards থেকে বিজ্ঞাপন দেখে রিওয়ার্ড সংগ্রহ করুন।</p>
          <div id="earn-rewards-slot" aria-live="polite"></div>
        `;
        const slot = document.getElementById("earn-rewards-slot");
        if (slot && typeof window.renderEarnRewardsCard === "function") {
          const completedAds = Number(window.currentRoyalProfile?.completedAds || 0);
          window.renderEarnRewardsCard(slot, { completedAds });
        }
      }
      if (modalOverlay) modalOverlay.classList.remove("hidden");
    });

    document.getElementById("btn-close-modal")?.addEventListener("click", () => {
      if (modalOverlay) modalOverlay.classList.add("hidden");
    });

    watchAuthState((user, profile) => {
      window.currentRoyalUser = user;
      window.currentRoyalProfile = profile;
      if (user && profile) {
        const nameEl = document.getElementById("display-name");
        const lvlEl = document.getElementById("player-level-badge");
        const coinEl = document.getElementById("coin-balance");
        const gemEl = document.getElementById("gem-balance");
        const box = document.getElementById("player-avatar-box");

        if (nameEl) nameEl.textContent = profile.name || "Royal Player";
        if (lvlEl) lvlEl.textContent = `Lvl ${profile.level || 1} • ${profile.isGuest ? "Guest" : "Verified"}`;
        if (coinEl) coinEl.textContent = Number(profile.coins ?? 1000).toLocaleString();
        if (gemEl) gemEl.textContent = Number(profile.gems ?? profile.diamonds ?? 25).toLocaleString();
        if (box) {
          box.innerHTML = profile.avatar
            ? `<img src="${escapeHtml(profile.avatar)}" alt="Avatar" referrerpolicy="no-referrer" />`
            : "👑";
        }
        hideAuthOverlay();
      }
    });
  </script>
</body>
</html>
